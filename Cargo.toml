[package]
name = "merklelsm"
version = "0.1.0"
edition = "2024"
rust-version = "1.89"
description = "Educational LSM audit ledger with Merkle-verified immutable tables"

[features]
fault-injection = []

[dependencies]
sha2 = "0.10"
crc32fast = "1.4"
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

